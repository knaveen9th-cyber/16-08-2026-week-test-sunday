<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-violet-950 text-white min-h-screen">

  const questions = [
    { question: "1. \"கல்தோன்றி மண் தோன்றாக் காலத்தே வாளோடு முன்தோன்றிய மூத்தக்குடி\" என்று எந்த நூலின் ஆசிரியர் கூறியுள்ளார்?", options: ["A) தொல்காப்பியம்", "B) புறப்பொருள் வெண்பாமாலை", "C) அகநானூறு", "D) நற்றிணை"], answer: 1 },
    { question: "2. தாராபாரதிக்கு வழங்கப்பட்ட சிறப்புப் பட்டம் என்ன?", options: ["A) பாவலரேறு", "B) கவிஞாயிறு", "C) பெருஞ்சித்திரனார்", "D) உவமைக் கவிஞர்"], answer: 1 },
    { question: "3. மைசூரிலிருந்து 5000 குதிரைப்படையை வேலுநாச்சியாரிடம் அனுப்பி வைத்தவர் யார்?", options: ["A) திப்பு சுல்தான்", "B) ஜெய் அலி", "C) ஹைதர் அலி", "D) நவாப் ஆற்காடு"], answer: 2 },
    { question: "4. 'மா' என்னும் சொல்லின் பொருள் அல்லாதது எது?", options: ["A) மரம்", "B) வயல்", "C) புல்", "D) வண்டு"], answer: 2 },
    { question: "5. பட்டுக்கோட்டை கல்யாணசுந்தரத்தை 'மக்கள் கவிஞர்' என அழைத்தவர் யார்?", options: ["A) பாரதிதாசன்", "B) ஜீவானந்தம்", "C) உடுமலை நாராயணகவி", "D) ஜெயகாந்தன்"], answer: 1 },
    { question: "6. பூவின் ஏழு நிலைகளில் இறுதியான (ஏழாவது) நிலை எது?", options: ["A) அரும்பு", "B) மலர்", "C) செம்மல்", "D) வீ"], answer: 2 },
    { question: "7. வேலுநாச்சியார் எந்தெந்த கலைகளில் பயிற்சி பெற்றிருந்தார்?", options: ["A) சிலம்பம், குதிரை ஏற்றம், வாள்சோர், வில்வித்தை", "B) வில்வித்தை மட்டும்", "C) சிலம்பம் மற்றும் நாட்டியம்", "D) மல்யுத்தம் மற்றும் கத்தி சண்டை"], answer: 0 },
    { question: "8. 'தமிழ்' என்னும் சொல் முதலில் எந்த இலக்கியத்தில் இடம்பெற்றுள்ளது?", options: ["A) சிலப்பதிகாரம்", "B) தொல்காப்பியம்", "C) திருக்குறள்", "D) கலித்தொகை"], answer: 1 },
    { question: "9. தாராபாரதி எந்த மாவட்டத்தில் பிறந்தார்?", options: ["A) தஞ்சாவூர்", "B) திருவண்ணாமலை", "C) மதுரை", "D) சேலம்"], answer: 1 },
    { question: "10. பட்டுக்கோட்டை கல்யாணசுந்தரம் தனது கருத்துகள் செறிமிக்க பாடல்களை எந்தப் பத்திரிகை மூலம் வெளியிட்டார்?", options: ["A) குங்குமம்", "B) ஜனசக்தி", "C) ஆனந்த விகடன்", "D) கல்கி"], answer: 1 },
    { question: "11. \"யாமறிந்த மொழிகளிலே தமிழ்மொழி போல் இனியாவது எங்கும் காணோம்\" என்று பாடியவர் யார்?", options: ["A) பாரதிதாசன்", "B) கம்பர்", "C) பாரதியார்", "D) திருவள்ளுவர்"], answer: 2 },
    { question: "12. வேலுநாச்சியார் வாழ்ந்த காலம் என்ன?", options: ["A) 1720 - 1790", "B) 1730 - 1796", "C) 1740 - 1800", "D) 1735 - 1798"], answer: 1 },
    { question: "13. 'தமிழ்நாடு' என்னும் சொல் எந்த இலக்கியத்தில் முதன்முதலில் ஆளப்பட்டுள்ளது?", options: ["A) அப்பர் தேவாரம்", "B) சிலப்பதிகாரம் (வஞ்சிக்காண்டம்)", "C) தொல்காப்பியம்", "D) புறநானூறு"], answer: 1 },
    { question: "14. 'வேளாண்மை' என்னும் சொல் இடம்பெற்றுள்ள நூல்களில் சரியான இணை எது?", options: ["A) நற்றிணை - 4", "B) குறுந்தொகை - 239", "C) கலித்தொகை - 101, திருக்குறள் - 81", "D) அகநானூறு - 42"], answer: 2 },
    { question: "15. தாராபாரதியின் இயற்பெயர் என்ன?", options: ["A) துரைசாமி", "B) இராதாகிருஷ்ணன்", "C) புஷ்பம்", "D) கவிஞாயிறு"], answer: 1 },
    { question: "16. உடையாள் நடுகல் அமைக்கப்படுவதற்குக் காரணமாக இருந்த நிகழ்வு எது?", options: ["A) வேலுநாச்சியாரைக் காட்டிக் கொடுக்க மறுத்ததால் உடையாள் கொல்லப்பட்டார்", "B) போரில் வீரமரணம் அடைந்தார்", "C) ஆங்கிலேயப் படைக் தளபதியைக் கொன்றார்", "D) ஆயுதக் கிடங்கில் தீ வைத்ததால் இறந்தார்"], answer: 0 },
    { question: "17. கணினித் தமிழில் 'Internet' என்பதன் சரியான கலைச்சொல் என்ன?", options: ["A) செயலி", "B) தேடு பொறி", "C) இணையம்", "D) தொடுதிரை"], answer: 2 },
    { question: "18. \"என்று பிறந்தவள் என்று உணராத இயல்பினாம் எங்கள் தாய்\" என்று தமிழின் தொன்மையைப் பற்றிக் கூறியவர் யார்?", options: ["A) பாரதிதாசன்", "B) பாரதியார்", "C) கம்பர்", "D) ஐயனாரிதனார்"], answer: 1 },
    { question: "19. பட்டுக்கோட்டை கல்யாணசுந்தரத்தின் முதல் பாடல் எது?", options: ["A) நல்லதைச் சொன்னானா நாத்திகனா", "B) தூங்காதே தம்பி தூங்காதே", "C) சின்னப் பயலே சின்னப் பயலே சேதி கேளடா", "D) திருடாத பாப்பா திருடாதே"], answer: 0 },
    { question: "20. வேலுநாச்சியார் சிவகங்கையை மீட்டு எப்போது இராணியாக முடிசூட்டிக் கொண்டார்?", options: ["A) 1772", "B) 1780", "C) 1790", "D) 1796"], answer: 1 },
    { question: "21. 'கோடை' என்னும் சொல் இடம்பெற்றுள்ள அகத்திணை நூல் எது?", options: ["A) நற்றிணை", "B) அகநானூறு - 42", "C) குறுந்தொகை", "D) ஐங்குறுநூறு"], answer: 1 },
    { question: "22. \"இனிமையும் நீர்மையும் தமிழெனல் ஆகும்\" என்று எந்த நிகண்டு கூறுகிறது?", options: ["A) சூடாமணி நிகண்டு", "B) பிங்கல நிகண்டு", "C) அகராதி நிகண்டு", "D) திவாகர நிகண்டு"], answer: 1 },
    { question: "23. பட்டுக்கோட்டை கல்யாணசுந்தரம் எழுதிய மொத்த திரைப்படப் பாடல்களின் எண்ணிக்கை எவ்வளவு?", options: ["A) 34", "B) 59", "C) 9", "D) 100"], answer: 1 },

  // ==================== HELPER FUNCTIONS ====================
  function preventThreeFingerTouch() {
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length >= 3) {
        e.preventDefault();
        e.stopImmediatePropagation();
        alert("❌ 3 விரல் தொடுதல் அனுமதிக்கப்படவில்லை!\n\nதேர்வின் போது இது தடைசெய்யப்பட்டுள்ளது.");
        return false;
      }
    }, { passive: false });
  }

  function togglePassword() {
    const pwd = document.getElementById('password');
    const btn = pwd.parentElement.querySelector('button');
    if (pwd.type === "password") {
      pwd.type = "text"; btn.textContent = "🙈";
    } else {
      pwd.type = "password"; btn.textContent = "👁️";
    }
  }

  // ==================== LOGIN (FIXED) ====================
  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('login-error');

    if (USERS[username] && USERS[username].pass === password) {
      currentUser = { username, ...USERS[username] };
      errorEl.classList.add('hidden');
      document.getElementById('login-block').classList.add('hidden');

      if (username === "admin") {
        document.getElementById('admin-block').classList.remove('hidden');
        fetchAdminData();
      } else {
        checkPreviousAttempt();
      }
    } else {
      errorEl.classList.remove('hidden');
    }
  }

  // ==================== CHECK PREVIOUS ATTEMPT (FIXED WITH ERROR HANDLING) ====================
  function checkPreviousAttempt() {
    db.ref('quiz_results/' + currentUser.username).once('value')
      .then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.answers && Array.isArray(data.answers) && data.answers.some(a => a !== null && a !== undefined)) {
            let correct = 0;
            data.answers.forEach((ans, i) => {
              if (ans === questions[i].answer) correct++;
            });
            data.correct = correct;
            data.incorrect = 100 - correct;
            data.score = correct;
            showResult(data);
          } else {
            startNewQuiz();
          }
        } else {
          startNewQuiz();
        }
      })
      .catch((error) => {
        console.error("Firebase error:", error);
        alert("Firebase இணைப்பில் சிக்கல். புதிய தேர்வு தொடங்கப்படுகிறது...");
        startNewQuiz();
      });
  }

  function startNewQuiz() {
    document.getElementById('quiz-block').classList.remove('hidden');
    answers = new Array(100).fill(null);
    currentIndex = 0;
    timeLeft = 3600;
    preventMobileReload();
    preventThreeFingerTouch();
    startTimer();
    loadQuestion();
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (timeLeft <= 0) submitQuiz();
    }, 1000);
  }

  function loadQuestion() {
    const q = questions[currentIndex];
    document.getElementById('q-no').textContent = currentIndex + 1;
    const progressPercent = ((currentIndex) / 100) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
    document.getElementById('question-text').textContent = q.question;
    const container = document.getElementById('options');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = `option p-6 rounded-2xl border cursor-pointer text-lg ${answers[currentIndex] === i ? 'selected' : ''}`;
      div.textContent = opt;
      div.onclick = () => {
        answers[currentIndex] = i;
        saveProgress();
        loadQuestion();
      };
      container.appendChild(div);
    });
    document.getElementById('next-btn').disabled = answers[currentIndex] === null;
  }

  function saveProgress() {
    if (!currentUser) return;
    db.ref('quiz_results/' + currentUser.username).update({
      name: currentUser.name,
      answers: answers,
      timestamp: new Date().toISOString()
    }).catch(err => console.error("Save progress error:", err));
  }

  function nextQuestion() {
    if (answers[currentIndex] === null) {
      alert("⚠️ கேள்விக்கு ஒரு விடையைத் தேர்ந்தெடுக்கவும்!");
      return;
    }
    if (currentIndex < 99) {
      currentIndex++;
      loadQuestion();
    } else {
      submitQuiz();
    }
  }

  function submitQuiz() {
    clearInterval(timerInterval);
    let correct = 0;
    answers.forEach((ans, i) => {
      if (ans === questions[i].answer) correct++;
    });
    const totalTime = 3600;
    const usedSeconds = totalTime - timeLeft;
    const hours = Math.floor(usedSeconds / 3600);
    const minutes = Math.floor((usedSeconds % 3600) / 60);
    const seconds = usedSeconds % 60;
    const finalTime =
      (hours > 0 ? hours + ":" : "") +
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");

    const result = {
      name: currentUser.name,
      score: correct,
      correct: correct,
      incorrect: 100 - correct,
      timeTaken: finalTime,
      answers: answers,
      timestamp: new Date().toISOString()
    };

    db.ref('quiz_results/' + currentUser.username).set(result)
      .then(() => showResult(result))
      .catch((err) => {
        console.error("Submit error:", err);
        showResult(result);
      });
  }

  function showResult(res) {
    document.getElementById('quiz-block').classList.add('hidden');
    document.getElementById('result-block').classList.remove('hidden');
    document.getElementById('score-text').textContent = res.score ?? res.correct ?? 0;
    document.getElementById('correct-count').textContent = res.correct ?? 0;
    document.getElementById('wrong-count').textContent = res.incorrect ?? (100 - (res.correct ?? 0));
    document.getElementById('time-taken').textContent = res.timeTaken || "60:00";
  }

  function preventMobileReload() {
    const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (!isMobile) return;
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey && (e.key === 'r' || e.key === 'R')) || e.key === 'F5') {
        e.preventDefault();
        alert("❌ மொபைல் குரோமில் ரீலோட் செய்ய முடியாது!");
      }
    });
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', () => {
      history.pushState(null, null, location.href);
      alert("❌ பின்னோக்கி செல்ல முடியாது!");
    });
  }

  // ==================== PDF FUNCTIONS ====================
  function generateDetailedPDF(username, result) {
    const element = document.createElement('div');
    element.style.padding = '40px';
    element.style.fontFamily = "'Noto Sans Tamil', sans-serif";
    element.style.background = 'white';
    element.style.color = '#1f2937';

    let correctCount = 0;
    questions.forEach((q, i) => {
      const selected = result.answers ? result.answers[i] : null;
      if (selected === q.answer) correctCount++;
    });
    const incorrectCount = 100 - correctCount;

    let html = `
      <h1 style="text-align:center; color:#4f46e5; font-size:28px;">VIVEKANANDAR TNPSC CENTRE</h1>
      <h2 style="text-align:center; margin:20px 0;">திருக்குறள் முழு விடை மதிப்பாய்வு அறிக்கை</h2>
      <div style="background:#f8fafc; padding:25px; border-radius:16px; margin-bottom:30px;">
        <strong>மாணவர்:</strong> ${result.name} (${username})<br>
        <strong>மதிப்பெண்:</strong> ${correctCount}/100 | சரி: ${correctCount} | தவறு: ${incorrectCount} | நேரம்: ${result.timeTaken || '60:00'}
      </div>
    `;

    questions.forEach((q, i) => {
      const selected = result.answers ? result.answers[i] : null;
      const isCorrect = selected === q.answer;
      html += `
        <div style="margin-bottom:25px; padding:20px; border:2px solid ${isCorrect ? '#10b981' : '#ef4444'}; border-radius:12px;">
          <strong>${i+1}. ${q.question}</strong><br><br>
          <strong>மாணவர் விடை:</strong> ${selected !== null && selected !== undefined ? q.options[selected] : "—"}
          <span style="color:${isCorrect ? '#10b981' : '#ef4444'};"> ${isCorrect ? '✅' : '❌'}</span><br>
          ${!isCorrect ? `<strong style="color:#10b981">சரியான விடை:</strong> ${q.options[q.answer]}` : ''}
        </div>`;
    });

    element.innerHTML = html;
    const opt = { margin: 15, filename: `${result.name}_Thirukkural_Result.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }};
    html2pdf().set(opt).from(element).save();
  }

  function downloadUserResult() {
    db.ref('quiz_results/' + currentUser.username).once('value')
      .then((snapshot) => {
        if (snapshot.exists()) generateDetailedPDF(currentUser.username, snapshot.val());
      })
      .catch(err => alert("PDF தரவை பெற முடியவில்லை: " + err.message));
  }

  function downloadSingleAdminResult(username, result) {
    generateDetailedPDF(username, result);
  }

  function downloadAllResultsFullPDF() {
    db.ref('quiz_results').once('value')
      .then((snapshot) => {
        let allHTML = `<div style="font-family:'Noto Sans Tamil',sans-serif; padding:40px; color:#1f2937;">
          <h1 style="text-align:center; color:#4f46e5;">VIVEKANANDAR TNPSC CENTRE</h1>
          <h2 style="text-align:center;">திருக்குறள் - அனைத்து மாணவர்கள் முழு விவரம்</h2>`;
        snapshot.forEach((child) => {
          const res = child.val();
          let cCount = 0;
          questions.forEach((q, qi) => {
            if (res.answers && res.answers[qi] === q.answer) cCount++;
          });
          allHTML += `<div style="page-break-before:always; margin-top:40px;">
            <h3 style="color:#4f46e5;">${res.name} (${child.key}) - ${cCount}/100</h3>`;
          questions.forEach((q, i) => {
            const selected = res.answers ? res.answers[i] : null;
            const isCorrect = selected === q.answer;
            allHTML += `
              <div style="margin:20px 0; padding:18px; border:2px solid ${isCorrect ? '#10b981' : '#ef4444'}; border-radius:10px;">
                <strong>${i+1}. ${q.question}</strong><br><br>
                <strong>மாணவர் விடை:</strong> ${selected !== null && selected !== undefined ? q.options[selected] : "—"}
                <span style="color:${isCorrect ? '#10b981' : '#ef4444'};"> ${isCorrect ? '✅' : '❌'}</span><br>
                ${!isCorrect ? `<strong style="color:#10b981">சரியான விடை:</strong> ${q.options[q.answer]}` : ''}
              </div>`;
          });
        });
        allHTML += `</div>`;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = allHTML;
        document.body.appendChild(tempDiv);
        const opt = { margin: 15, filename: 'Thirukkural_All_Users_Full_Details.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }};
        html2pdf().set(opt).from(tempDiv).save().then(() => document.body.removeChild(tempDiv));
      })
      .catch(err => alert("அனைத்து முடிவுகளையும் பெற முடியவில்லை: " + err.message));
  }

  // ==================== ADMIN ====================
  function fetchAdminData() {
    const tbody = document.getElementById('admin-tbody');
    tbody.innerHTML = '';
    db.ref('quiz_results').once('value')
      .then((snapshot) => {
        let totalStudents = 0, totalScore = 0;
        snapshot.forEach((child) => {
          const res = child.val();
          totalStudents++;
          let correct = 0;
          if (res.answers) {
            res.answers.forEach((ans, qi) => {
              if (ans === questions[qi].answer) correct++;
            });
          }
          const incorrect = 100 - correct;
          totalScore += correct;
          const row = document.createElement('tr');
          row.className = "border-b border-white/10 hover:bg-white/10 cursor-pointer transition";
          row.innerHTML = `
            <td class="py-5 font-medium">${res.name}</td>
            <td class="py-5 text-indigo-300">${child.key}</td>
            <td class="text-center py-5 font-bold">${correct}/100</td>
            <td class="text-center py-5 text-emerald-400">${correct}</td>
            <td class="text-center py-5 text-rose-400">${incorrect}</td>
            <td class="text-center py-5 text-amber-300">${res.timeTaken || "60:00"}</td>
            <td class="text-center py-5">
              <button class="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-medium shadow transition">📥 PDF</button>
            </td>
          `;
          tbody.appendChild(row);
          row.querySelector('button').addEventListener('click', (e) => {
            e.stopImmediatePropagation();
            downloadSingleAdminResult(child.key, res);
          });
        });
        const avg = totalStudents ? (totalScore / totalStudents).toFixed(1) : 0;
        document.getElementById('admin-stats').innerHTML = `
          <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
            <div class="text-5xl font-bold">${totalStudents}</div>
            <div class="text-sm text-indigo-300 mt-2">மொத்த மாணவர்கள்</div>
          </div>
          <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
            <div class="text-5xl font-bold">${avg}</div>
            <div class="text-sm text-indigo-300 mt-2">சராசரி மதிப்பெண்</div>
          </div>
        `;
      })
      .catch(err => {
        console.error("Admin fetch error:", err);
        alert("Admin data பெற முடியவில்லை: " + err.message);
      });
  }
</script>
